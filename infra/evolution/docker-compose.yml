# Evolution API v2 - local Podman/Docker for Inspectoría WhatsApp line
services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      DATABASE_ENABLED: "false"
      # Point webhook to host Next.js after instance create:
      # http://host.containers.internal:3000/api/webhooks/evolution
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
