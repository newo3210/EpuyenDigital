# Evolution API v2 - local Docker for Inspectoría WhatsApp line
# Note: bridge networking is flaky in some Cloud Agent VMs; prefer:
#   docker run --network host ... (see docs/runbooks)
services:
  evolution-pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    ports:
      - "5433:5432"

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    restart: unless-stopped
    depends_on:
      - evolution-pg
    network_mode: host
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@127.0.0.1:5433/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      # Webhook target: http://127.0.0.1:3000/api/webhooks/evolution
